name: GX Windows and Linux
on:
  push:
    branches: [main]
    tags: ['gx-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-amd64
          - os: windows-latest
            platform: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: ${{ runner.os != 'Windows' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Storage tools on the native OS
        shell: bash
        run: python -m unittest discover -s server/tools -p 'test_*.py'
      - uses: actions/cache/restore@v4
        if: runner.os == 'Windows'
        id: windows-cache
        with:
          key: gx-windows-go-1.27.3-${{ hashFiles('go.sum') }}
          path: |
            ~/AppData/Local/go-build
            ~/go/pkg/mod
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev libasound2-dev
      - name: Build and unit test (Linux)
        if: runner.os == 'Linux'
        run: ./tools/build.sh
      - name: Build and unit test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/build.ps1
      - name: Validate external fonts and Unicode coverage
        shell: bash
        env:
          SHAIYA_DATA: ${{ github.workspace }}/resources
        run: |
          python tools/font_pack.py
          go test ./internal/ui -run '^TestExternalFontLazyCoverageAndEmojiClusters$' -count=1
      - name: Package client with fonts, without game artwork
        shell: bash
        run: python tools/package_client.py --platform '${{ matrix.platform }}' --output out/client
      - uses: actions/upload-artifact@v4
        with:
          name: gx-client-${{ matrix.platform }}
          path: |
            out/client/*.tar.gz
            out/client/*.zip
          if-no-files-found: error
      - name: Server integration and storage tools
        shell: bash
        run: |
          go test -tags integration ./server/... -count=1
          python tools/check_publication.py --history
      - name: Build portable and verify native startup
        shell: bash
        run: python server/tools/package.py --platform '${{ matrix.platform }}' --output out/portable
      - uses: actions/upload-artifact@v4
        with:
          name: gx-server-${{ matrix.platform }}
          path: out/portable/*
          if-no-files-found: error
      - uses: actions/cache/save@v4
        if: always() && runner.os == 'Windows' && steps.windows-cache.outcome == 'success' && steps.windows-cache.outputs.cache-hit != 'true'
        with:
          key: gx-windows-go-1.27.3-${{ hashFiles('go.sum') }}
          path: |
            ~/AppData/Local/go-build
            ~/go/pkg/mod
  release:
    if: startsWith(github.ref, 'refs/tags/gx-v')
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: portable
      - name: Publish GX client and server portables
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GX_TAG: ${{ github.ref_name }}
        run: |
          mkdir release
          cp portable/gx-client-linux-amd64/*.tar.gz release/
          cp portable/gx-client-windows-amd64/*.zip release/
          cp portable/gx-server-linux-amd64/*.tar.gz release/
          cp portable/gx-server-windows-amd64/*.zip release/
          (cd release && sha256sum *.tar.gz *.zip > SHA256SUMS.txt)
          cp "docs/releases/$GX_TAG.md" release-notes.txt
          gh release create "$GX_TAG" release/* --verify-tag --title "Shaiya GX $GX_TAG" --notes-file release-notes.txt
